[workspace]
resolver = "3"
members = ["crates/*", "napi/*"]
# Vendored dependency patches are consumed through [patch.crates-io] below and
# must not become workspace members (their upstream code is not held to this
# workspace's lint and test gates).
exclude = ["vendor/svgm-core"]

[workspace.package]
version = "0.1.0-rc.5"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/ntnyq/imagemin-rs"
description = "An imagemin-compatible image optimization pipeline powered by Rust and napi-rs."

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
gif = "=0.13.3"
gif-dispose = "=5.0.1"
imagemin = { version = "0.1.0-rc.5", path = "crates/imagemin" }
imagemin-codec-gif = { path = "crates/imagemin-codec-gif" }
imagemin-codec-png = { path = "crates/imagemin-codec-png" }
imagemin-codec-svg = { path = "crates/imagemin-codec-svg" }
imagemin-core = { path = "crates/imagemin-core" }
napi = { version = "3.10.5", default-features = false, features = ["napi8"] }
napi-build = "2.3.2"
napi-derive = "3.5.10"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel"] }
png = "0.18.1"
resvg = { version = "0.47.0", default-features = false }
rgb = "=0.8.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgm-core = "=0.3.8"
thiserror = "2"
xmlparser = "0.13"

# svgm-core 0.3.8 hangs on unconsumable path-data characters (DoS); the vendored
# copy carries a one-line parse_path fix. See vendor/svgm-core/VENDORED.md.
[patch.crates-io]
svgm-core = { path = "vendor/svgm-core" }

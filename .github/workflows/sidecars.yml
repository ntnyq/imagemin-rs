name: Sidecars

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build-cwebp:
    name: Build cwebp ${{ matrix.directory }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            directory: darwin-arm64
            zig-target: ""
          - runner: macos-latest
            directory: darwin-x64
            zig-target: ""
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
            zig-target: aarch64-linux-gnu.2.28
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-musl
            zig-target: aarch64-linux-musl
          - runner: ubuntu-latest
            directory: linux-x64-gnu
            zig-target: x86_64-linux-gnu.2.28
          - runner: ubuntu-latest
            directory: linux-x64-musl
            zig-target: x86_64-linux-musl
          - runner: windows-11-arm
            directory: win32-arm64-msvc
            zig-target: ""
          - runner: windows-latest
            directory: win32-x64-msvc
            zig-target: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.14.1
      - uses: actions/cache@v5
        with:
          path: .release/sidecar-sources
          key: sidecar-sources-${{ runner.os }}-${{ hashFiles('tasks/sidecars/pins.json') }}
      - name: Fetch pinned sources
        shell: bash
        run: >-
          node tasks/sidecars/fetch-sources.mjs
          --tool cwebp
          --output .release/sidecar-sources
      - name: Build cwebp
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.directory }}
          SIDECAR_ZIG_TARGET: ${{ matrix.zig-target }}
        run: >-
          tasks/sidecars/build-cwebp.sh
          .release/sidecar-sources
          .release/sidecars/${{ matrix.directory }}
      - name: Smoke cwebp
        shell: bash
        run: >-
          node tasks/sidecars/smoke-cwebp.mjs
          --binary .release/sidecars/${{ matrix.directory }}/cwebp${{
          startsWith(matrix.directory, 'win32-') && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-cwebp-${{ matrix.directory }}
          path: .release/sidecars/${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 14

  build-mozjpeg:
    name: Build MozJPEG ${{ matrix.directory }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            directory: darwin-arm64
            zig-target: ""
          - runner: macos-latest
            directory: darwin-x64
            zig-target: ""
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
            zig-target: aarch64-linux-gnu.2.28
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-musl
            zig-target: aarch64-linux-musl
          - runner: ubuntu-latest
            directory: linux-x64-gnu
            zig-target: x86_64-linux-gnu.2.28
          - runner: ubuntu-latest
            directory: linux-x64-musl
            zig-target: x86_64-linux-musl
          - runner: windows-11-arm
            directory: win32-arm64-msvc
            zig-target: ""
          - runner: windows-latest
            directory: win32-x64-msvc
            zig-target: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.14.1
      - uses: actions/cache@v5
        with:
          path: .release/sidecar-sources
          key: sidecar-sources-${{ runner.os }}-${{ hashFiles('tasks/sidecars/pins.json') }}
      - name: Fetch pinned source
        shell: bash
        run: >-
          node tasks/sidecars/fetch-sources.mjs
          --tool mozjpeg
          --output .release/sidecar-sources
      - name: Build MozJPEG
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.directory }}
          SIDECAR_ZIG_TARGET: ${{ matrix.zig-target }}
        run: >-
          tasks/sidecars/build-mozjpeg.sh
          .release/sidecar-sources
          .release/sidecars/${{ matrix.directory }}
      - name: Smoke MozJPEG
        shell: bash
        run: >-
          node tasks/sidecars/smoke-mozjpeg.mjs
          --cjpeg .release/sidecars/${{ matrix.directory }}/cjpeg${{
          startsWith(matrix.directory, 'win32-') && '.exe' || '' }}
          --jpegtran .release/sidecars/${{ matrix.directory }}/jpegtran${{
          startsWith(matrix.directory, 'win32-') && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-mozjpeg-${{ matrix.directory }}
          path: .release/sidecars/${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 14

  build-pngquant:
    name: Build pngquant ${{ matrix.directory }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            directory: darwin-arm64
            rust-target: aarch64-apple-darwin
          - runner: macos-latest
            directory: darwin-x64
            rust-target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
            rust-target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-musl
            rust-target: aarch64-unknown-linux-musl
          - runner: ubuntu-latest
            directory: linux-x64-gnu
            rust-target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            directory: linux-x64-musl
            rust-target: x86_64-unknown-linux-musl
          - runner: windows-11-arm
            directory: win32-arm64-msvc
            rust-target: aarch64-pc-windows-msvc
          - runner: windows-latest
            directory: win32-x64-msvc
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust-target }}
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - uses: actions/cache@v5
        with:
          path: .release/sidecar-sources
          key: sidecar-sources-${{ runner.os }}-${{ hashFiles('tasks/sidecars/pins.json') }}
      - name: Fetch pinned sources
        shell: bash
        run: >-
          node tasks/sidecars/fetch-sources.mjs
          --tool pngquant
          --output .release/sidecar-sources
      - name: Build pngquant
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.directory }}
        run: >-
          tasks/sidecars/build-pngquant.sh
          .release/sidecar-sources
          .release/sidecars/${{ matrix.directory }}
      - name: Smoke pngquant
        shell: bash
        run: >-
          node tasks/sidecars/smoke-pngquant.mjs
          --binary .release/sidecars/${{ matrix.directory }}/pngquant${{
          startsWith(matrix.directory, 'win32-') && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-pngquant-${{ matrix.directory }}
          path: .release/sidecars/${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 14

  build-gifsicle:
    name: Build Gifsicle ${{ matrix.directory }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            directory: darwin-arm64
            zig-target: ""
          - runner: macos-latest
            directory: darwin-x64
            zig-target: ""
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
            zig-target: aarch64-linux-gnu.2.28
          - runner: ubuntu-24.04-arm
            directory: linux-arm64-musl
            zig-target: aarch64-linux-musl
          - runner: ubuntu-latest
            directory: linux-x64-gnu
            zig-target: x86_64-linux-gnu.2.28
          - runner: ubuntu-latest
            directory: linux-x64-musl
            zig-target: x86_64-linux-musl
          - runner: windows-11-arm
            directory: win32-arm64-msvc
            zig-target: ""
          - runner: windows-latest
            directory: win32-x64-msvc
            zig-target: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.14.1
      - uses: actions/cache@v5
        with:
          path: .release/sidecar-sources
          key: sidecar-sources-${{ runner.os }}-${{ hashFiles('tasks/sidecars/pins.json') }}
      - name: Fetch pinned source
        shell: bash
        run: >-
          node tasks/sidecars/fetch-sources.mjs
          --tool gifsicle
          --output .release/sidecar-sources
      - name: Build Gifsicle
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.directory }}
          SIDECAR_ZIG_TARGET: ${{ matrix.zig-target }}
        run: >-
          tasks/sidecars/build-gifsicle.sh
          .release/sidecar-sources
          .release/sidecars/${{ matrix.directory }}
      - name: Smoke Gifsicle
        shell: bash
        run: >-
          node tasks/sidecars/smoke-gifsicle.mjs
          --binary .release/sidecars/${{ matrix.directory }}/gifsicle${{
          startsWith(matrix.directory, 'win32-') && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-gifsicle-${{ matrix.directory }}
          path: .release/sidecars/${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 14

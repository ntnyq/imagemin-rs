name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          toolchain: 1.88.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - uses: actions/cache@v5
        with:
          path: .release/sidecar-sources
          key: sidecar-sources-${{ runner.os }}-${{ hashFiles('tasks/sidecars/pins.json') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Fetch benchmark sidecar sources
        run: |
          for tool in cwebp mozjpeg pngquant gifsicle; do
            node tasks/sidecars/fetch-sources.mjs \
              --tool "$tool" \
              --output .release/sidecar-sources
          done
      - name: Build benchmark sidecars
        env:
          SIDECAR_TARGET: linux-x64-gnu
          SIDECAR_ZIG_TARGET: x86_64-linux-gnu.2.28
        run: |
          for tool in cwebp mozjpeg pngquant gifsicle; do
            tasks/sidecars/build-"$tool".sh \
              .release/sidecar-sources \
              .release/benchmark-sidecars/sidecar-"$tool"-linux-x64-gnu
          done
      - name: Assemble benchmark sidecars
        run: >-
          node tasks/sidecars/assemble-packages.mjs
          --artifacts .release/benchmark-sidecars
          --npm-dir npm
          --targets linux-x64-gnu
      - run: node tasks/benchmark-svg.mjs > svg-benchmark.json
      - run: node tasks/benchmark-phase2.mjs > phase2-benchmark.json
      - run: node tasks/benchmark-phase3.mjs > phase3-benchmark.json
      - run: node tasks/benchmark-phase4.mjs > phase4-benchmark.json
      - run: node tasks/benchmark-phase5.mjs > phase5-benchmark.json
      - run: node tasks/benchmark-phase6.mjs > phase6-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: svg-benchmark-linux-x64-node24
          path: svg-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase2-benchmark-linux-x64-node24
          path: phase2-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase3-benchmark-linux-x64-node24
          path: phase3-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase4-benchmark-linux-x64-node24
          path: phase4-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase5-benchmark-linux-x64-node24
          path: phase5-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase6-benchmark-linux-x64-node24
          path: phase6-benchmark.json

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level high
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories bans licenses sources

  test-platforms:
    runs-on: ${{ matrix.os }}
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --workspace
      - run: pnpm run build:native
      - run: pnpm --filter @imagemin-rs/binding test
      - run: pnpm --filter imagemin-rs test

[package]
name = "imagemin-codec-png"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native PNG optimizers for imagemin-rs."
publish = false

[dependencies]
imagemin-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxipng = { workspace = true, features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
oxipng = { workspace = true, features = ["freestanding"] }

[dev-dependencies]
png = { workspace = true }

[lints]
workspace = true
